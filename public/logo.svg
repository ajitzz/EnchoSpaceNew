<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C24A30" />
      <stop offset="100%" stop-color="#E05A3D" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="15" dy="25" stdDeviation="20" flood-color="#E05A3D" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="#1A1C21" rx="200"/>
  <g transform="translate(180, 200)" filter="url(#shadow)">
    <!-- The Forward Spark ('A' shape moving forward) -->
    <path d="M 180 650 L 330 180 L 480 650" fill="none" stroke="url(#brandGrad)" stroke-width="120" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 260 450 L 580 450 L 680 300" fill="none" stroke="url(#brandGrad)" stroke-width="120" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="630" cy="180" r="80" fill="#F4B34A" />
  </g>
</svg>
