name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-build:
    name: Validate and Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run Linter
      run: npm run lint

    - name: Run Type Checking
      run: npm run typecheck

    - name: Configure disposable PostgreSQL fixtures
      run: |
        PG_BIN="$(dirname "$(find /usr/lib/postgresql -name initdb -type f | sort -V | tail -1)")"
        test -x "$PG_BIN/initdb"
        test -x "$PG_BIN/pg_dump"
        echo "HARVO_POSTGRES_BIN=$PG_BIN" >> "$GITHUB_ENV"

    - name: Run Tests
      run: |
        mkdir -p test-results
        # Raw assertion/provider payloads stay on the ephemeral runner, not in artifacts.
        set +e
        npm run test -- --reporter=json --outputFile=test-results/full-suite.json > test-results/full-suite.log 2>&1
        test_status=$?
        node scripts/testing/summarize-results.mjs test-results/full-suite.json test-results/ci-summary.json
        summary_status=$?
        if [ "$test_status" -ne 0 ]; then exit "$test_status"; fi
        exit "$summary_status"

    - name: Preserve test evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: isolated-test-evidence
        path: test-results/ci-summary.json
        if-no-files-found: ignore
        retention-days: 7

    - name: Build Application
      run: npm run build

  docker-build-test:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [validate-and-build]
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Test Docker Build
      run: docker build -t nestpick-clone-test .
